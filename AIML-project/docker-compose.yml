services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cadastral}"
      POSTGRES_USER: "${POSTGRES_USER:-cadastral}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadastral} -d ${POSTGRES_DB:-cadastral}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cadastral}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-cadastral}"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80,http://127.0.0.1:5173"
      UPLOAD_DIR: "/app/data/sample"
      EXPORTS_DIR: "/app/data/exports"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    ports:
      - "5173:5173"
